<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${post.title}">Post Title</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f9f9f9;
        color: #333;
    }

    h1 {
        color: #222;
        margin-bottom: 10px;
    }

    .meta, .tags, .comments-section, .comment-form {
        margin-bottom: 25px;
    }

    .tag {
        display: inline-block;
        background-color: #e0e0e0;
        color: #333;
        padding: 5px 10px;
        margin: 2px;
        border-radius: 15px;
        font-size: 14px;
    }

    .comment-box {
        background: #f9f9f9;
        padding: 15px;
        margin-bottom: 15px;
        border-left: 4px solid #007bff;
        border-radius: 5px;
    }

    .comment-header {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-bottom: 5px;
    }

    .comment-header a {
        font-size: 14px;
        text-decoration: none;
    }

    .comment-header a:first-child {
        color: #007bff;
    }

    .comment-header a:last-child {
        color: #dc3545;
    }

    .comment-author {
        margin: 0;
        font-weight: bold;
    }

    .comment-email {
        margin: 0 0 8px 0;
        color: gray;
        font-size: 14px;
    }

    .comment-content {
        margin: 10px 0;
        font-size: 15px;
    }

    .comment-timestamp {
        color: #888;
        font-size: 12px;
    }

    .comment-form input,
    .comment-form textarea {
        width: 100%;
        padding: 8px;
        margin: 5px 0 15px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .comment-form button {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .comment-form button:hover {
        background-color: #0056b3;
    }

    .post-actions a {
        display: inline-block;
        padding: 8px 12px;
        margin-right: 10px;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 14px;
    }

    .post-actions .edit {
        background-color: #ffc107;
    }

    .post-actions .delete {
        background-color: #dc3545;
    }

    .back-link a {
        color: #007bff;
        text-decoration: none;
    }

    .back-link a:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="post-actions" style="margin-top: 20px;">
  <a th:href="@{/posts/edit(postId=${post.id})}" class="edit">Edit</a>
  <a th:href="@{/posts/delete(postId=${post.id})}"
     onclick="return confirm('Are you sure you want to delete this post?');"
     class="delete">Delete</a>
</div>

<h1 th:text="${post.title}">Post Title</h1>

<div class="meta">
  <p><strong>Author:</strong> <span th:text="${post.author}">Author</span></p>
  <p><strong>Published At:</strong> <span th:text="${#temporals.format(post.publishedAt, 'dd MMM yyyy HH:mm')}">Publish Date</span></p>
  <p><strong>Last Updated:</strong> <span th:text="${#temporals.format(post.updatedAt, 'dd MMM yyyy HH:mm')}">Update Date</span></p>
</div>

<div class="content">
  <h3>Content</h3>
  <p th:text="${post.content}">Post content here...</p>
</div>

<div class="tags">
  <h4>Tags</h4>
  <span th:each="tag : ${post.tags}" class="tag" th:text="${tag.name}">Tag</span>
</div>

<div class="comments-section">
  <h3 th:text="'Comments (' + ${post.comments.size()} + ')'">Comments (0)</h3>

  <div th:each="comment : ${post.comments}" class="comment-box">
    <div class="comment-header">
      <a th:href="@{/comments/edit(commentId=${comment.id})}">Edit</a>
      <a th:href="@{/comments/delete(commentId=${comment.id})}"
         onclick="return confirm('Are you sure you want to delete this comment?');">Delete</a>
    </div>
    <p class="comment-author" th:text="${comment.name}">Name</p>
    <p class="comment-email" th:text="${comment.email}">email@example.com</p>
    <p class="comment-content" th:text="${comment.comment}">Comment text</p>
    <p class="comment-timestamp" th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy HH:mm')}">Timestamp</p>
  </div>
</div>

<div class="comment-form">
  <h3>Add a Comment</h3>
  <form th:action="@{/comments/add}" th:object="${newComment}" method="post">
    <input type="hidden" th:field="*{post.id}" th:value="${post.id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" required />

    <label>Email:</label>
    <input type="email" th:field="*{email}" required />

    <label>Comment:</label>
    <textarea th:field="*{comment}" required></textarea>

    <button type="submit">Submit Comment</button>
  </form>
</div>

<div class="back-link">
  <a th:href="@{/posts/list}">← Back to Posts</a>
</div>

</body>
</html>
