<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Comment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
            color: #333;
        }

        h2 {
            text-align: center;
            color: #444;
        }

        .form-container {
            background-color: #fff;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[disabled] {
            background-color: #f5f5f5;
            color: #888;
        }

        button {
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #007bff;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Edit Comment</h2>

    <form th:action="@{/comments/update}" th:object="${comment}" method="post">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{post.id}" />

        <label>Name:</label>
        <input type="text" th:value="${comment.name}" disabled />
        <input type="hidden" th:field="*{name}" />

        <label>Email:</label>
        <input type="email" th:value="${comment.email}" disabled />
        <input type="hidden" th:field="*{email}" />

        <label>Comment:</label>
        <textarea th:field="*{comment}" rows="4" required></textarea>

        <button type="submit">Update</button>
    </form>

    <div class="back-link">
        <a th:href="@{/posts/view(postId=${comment.post.id})}">← Back to Post</a>
    </div>
</div>

</body>
</html>
